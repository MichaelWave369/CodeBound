name: Validate and publish CodeBound
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codebound-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run build
      - name: Verify field kit checksum
        run: cd dist/site && sha256sum -c codebound-field-kit.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: codebound-field-kit-${{ github.sha }}
          path: |
            dist/site/codebound-field-kit.zip
            dist/site/codebound-field-kit.zip.sha256
          if-no-files-found: error
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: tests
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
